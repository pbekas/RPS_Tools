services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rps_call_qa
      POSTGRES_USER: rps_app
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "55432:5432"
    volumes:
      - rps-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rps_app -d rps_call_qa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rps-postgres-data:
